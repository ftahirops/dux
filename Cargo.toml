[package]
name = "dux"
version = "0.6.3"
edition = "2021"
description = "Persistent realtime disk usage + file search. du/ncdu/locate/find, but indexed and live."
license = "MIT"

[features]
# Explicit opt-in for isolated crash tests; production builds contain no hooks.
fault-injection = []

[[bin]]
name = "dux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "backup"] }
nix = { version = "0.29", features = ["fs", "dir", "user"] }
libc = "0.2"
rayon = "1"
jwalk = "0.8"
crossbeam-channel = "0.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = "0.29"
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humansize = "2"
unicode-width = "0.2"
serde_json = "1"

[build-dependencies]
sha2 = "0.10"

[patch.crates-io]
# Dux needs directory-instance state to flow from each discovered directory
# entry into that directory's parallel read task for the v6 path graph.
jwalk = { path = "vendor/jwalk" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
