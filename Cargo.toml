[package]
name = "dux"
version = "1.0.0"
edition = "2021"
description = "Disk-full alerts with folder attribution, fast disk walks and safe cleanup for Linux servers."
license = "PolyForm-Noncommercial-1.0.0"

[features]
# Explicit opt-in for isolated crash tests; production builds contain no hooks.
fault-injection = []

[[bin]]
name = "dux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = "0.29"
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humansize = "2"
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
